<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rendered viewer positive control</title></head>
<body>
  <button class="scene">Triangle scene</button>
  <canvas width="640" height="480"></canvas>
  <script>
    const canvas = document.querySelector("canvas");
    const gl = canvas.getContext("webgl", {preserveDrawingBuffer: true});
    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader,
      "attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}");
    gl.compileShader(vertexShader);
    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader,
      "precision mediump float; void main(){gl_FragColor=vec4(0.3,0.7,1.0,1.0);}");
    gl.compileShader(fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);
    const points = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, points);
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-0.7, -0.7, 0.7, -0.7, 0.0, 0.7]),
      gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "p");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    gl.clearColor(0.059, 0.075, 0.106, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  </script>
</body>
</html>
